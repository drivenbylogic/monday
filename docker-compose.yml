version: '3.8'

services:
  db:
    image: postgres:17
    container_name: monday_db
    environment:
      POSTGRES_DB: monday
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monday_backend
    ports:
      - "8080:8080"
    environment:
      - MONDAY_DB_URL=jdbc:postgresql://db:5432/monday
      - MONDAY_DB_USERNAME=postgres
      - MONDAY_DB_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
