version: '3.8'

services:
  db:
    image: postgres:17
    container_name: monday_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: monday
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/master_schema.sql:/docker-entrypoint-initdb.d/01_master_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monday"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monday_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONDAY_DB_URL=jdbc:postgresql://db:5432/monday
      - MONDAY_DB_USERNAME=postgres
      - MONDAY_DB_PASSWORD=admin
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MONDAY_SESSION_SECURE=${MONDAY_SESSION_SECURE:-true}
      - MONDAY_SESSION_SAME_SITE=${MONDAY_SESSION_SAME_SITE:-none}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://monday-ui-omega.vercel.app,https://monday-ui-omega.vercel.app/}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
