# =============================================================================
# Monday Application Configuration
# =============================================================================
spring.application.name=monday-backend

# --- Server ---
server.port=8080

# --- Database ---
spring.datasource.url=${MONDAY_DB_URL:jdbc:postgresql://localhost:5432/monday}
spring.datasource.username=${MONDAY_DB_USERNAME:postgres}
spring.datasource.password=${MONDAY_DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Session & Cookie Authentication ---
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=MONDAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${MONDAY_SESSION_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.monday.app=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG

ai.openai.api-key=${OPENAI_API_KEY:}
ai.default-model=gpt-4o-mini

# --- Agenda Model Configuration ---
agenda.cache.min-refresh-interval-hours=6

# --- Intelligence Module Configuration ---
intelligence.scheduler.enabled=true
intelligence.scheduler.cron=0 0 6 * * ?
intelligence.scheduler.zone=Asia/Kolkata
intelligence.retention.cron=0 0 3 * * ?
intelligence.retention.days=7
intelligence.cooldown-hours=6
intelligence.feed.fetch.timeout-ms=10000
intelligence.feed.max-response-bytes=2097152
intelligence.cost.max-articles-per-node=5
intelligence.cost.max-articles-per-run=25
intelligence.cost.max-input-chars=8000
intelligence.cost.max-output-tokens=350
intelligence.cost.max-tokens-per-run=50000
intelligence.cost.per-1k-tokens-usd=0.0003