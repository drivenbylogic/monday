# =============================================================================
# Monday Application Configuration
# =============================================================================
spring.application.name=monday-backend

# --- Server ---
server.port=8080

# --- Database ---
spring.datasource.url=${MONDAY_DB_URL:jdbc:postgresql://localhost:5432/monday}
spring.datasource.username=${MONDAY_DB_USERNAME:postgres}
spring.datasource.password=${MONDAY_DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- JWT ---
monday.security.jwt.secret=${MONDAY_JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-for-hs256}
monday.security.jwt.expiration-ms=86400000

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Logging ---
logging.level.com.monday.app=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
