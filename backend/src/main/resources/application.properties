# =============================================================================
# Monday Application Configuration
# =============================================================================
spring.application.name=monday-backend

# --- Server & Cloud Network ---
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${MONDAY_DB_URL:jdbc:postgresql://localhost:5432/monday}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MONDAY_DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MONDAY_DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool (Optimized for Cloud Postgres/RDS/Supabase/Neon) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}

# --- Flyway ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:${FLYWAY_ENABLED:false}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Session & Cookie Authentication ---
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=MONDAY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${MONDAY_SESSION_SECURE:true}
server.servlet.session.cookie.same-site=${MONDAY_SESSION_SAME_SITE:none}
server.servlet.session.cookie.path=/

# --- CORS Configuration ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://monday-ui-omega.vercel.app,https://monday-ui-omega.vercel.app/}

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator & Health Probes (Kubernetes / Cloud Run / AWS ECS) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Graceful Shutdown Timeout ---
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Logging ---
logging.level.com.monday.app=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.jdbc.core=${LOGGING_LEVEL_SQL:WARN}

# --- AI Integration ---
ai.openai.api-key=${OPENAI_API_KEY:}
ai.default-model=${AI_DEFAULT_MODEL:gpt-4o-mini}

# --- Agenda Model Configuration ---
agenda.cache.min-refresh-interval-hours=6

# --- Intelligence Module Configuration ---
intelligence.scheduler.enabled=${INTELLIGENCE_SCHEDULER_ENABLED:true}
intelligence.scheduler.cron=0 0 6 * * ?
intelligence.scheduler.zone=${INTELLIGENCE_TIMEZONE:Asia/Kolkata}
intelligence.retention.cron=0 0 3 * * ?
intelligence.retention.days=7
intelligence.cooldown-hours=6
intelligence.feed.fetch.timeout-ms=10000
intelligence.feed.max-response-bytes=2097152
intelligence.cost.max-articles-per-node=5
intelligence.cost.max-articles-per-run=25
intelligence.cost.max-input-chars=8000
intelligence.cost.max-output-tokens=350
intelligence.cost.max-tokens-per-run=50000
intelligence.cost.per-1k-tokens-usd=0.0003
